filebeat.inputs:
  - type: container
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log

processors:
  - add_docker_metadata: ~

setup.kibana:
  host: "http://kibana:5601"

setup.template.enabled: true
setup.template.name: "logs-content-hub"
setup.template.pattern: "logs-content-hub-*"

setup.template.settings:
  index.number_of_shards: 1

setup.ilm.enabled: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "logs-content-hub-%{+yyyy.MM.dd}"

logging.level: info