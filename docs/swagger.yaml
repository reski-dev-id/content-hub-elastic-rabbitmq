basePath: /
definitions:
  entity.News:
    properties:
      author:
        type: string
      category_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      published_at:
        type: string
      slug:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  entity.Product:
    properties:
      category_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      price:
        type: number
      slug:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      meta: {}
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: Product and News API with Elasticsearch Search
  title: Content Hub API
  version: "1.0"
paths:
  /v1/news:
    get:
      consumes:
      - application/json
      description: Get news with pagination
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Category ID
        in: query
        name: category_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get news list
      tags:
      - news
    post:
      consumes:
      - application/json
      description: Create new news
      parameters:
      - description: News payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/entity.News'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Create news
      tags:
      - news
  /v1/news/{id}:
    delete:
      consumes:
      - application/json
      description: Delete news by ID
      parameters:
      - description: News ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Delete news
      tags:
      - news
    get:
      consumes:
      - application/json
      description: Get news by ID
      parameters:
      - description: News ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get news detail
      tags:
      - news
    put:
      consumes:
      - application/json
      description: Update news by ID
      parameters:
      - description: News ID
        in: path
        name: id
        required: true
        type: integer
      - description: News payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/entity.News'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Update news
      tags:
      - news
  /v1/products:
    get:
      consumes:
      - application/json
      description: Get product list with pagination
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Category ID
        in: query
        name: category_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get products
      tags:
      - products
    post:
      consumes:
      - application/json
